<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>레전더리 개별 파츠 동작 확인</title><style>body{font:15px system-ui;background:#dfe5ec;color:#20334b;padding:24px}button{padding:10px 16px;margin:8px}main{display:flex;flex-wrap:wrap;gap:16px}article{background:white;padding:20px;border-radius:12px;text-align:center;min-width:260px}object{width:256px;height:256px;background:#dfe5ec}.small object{width:128px;height:128px}h2{font-size:16px}</style><body><h1>레전더리 개별 파츠 동작 확인</h1><p>이펙트는 기본으로 숨깁니다. 처음에는 고정 테두리도 숨기고 실제 독립 파츠만 재생합니다. ‘테두리도 보기’로 전체 조립 상태를 확인할 수 있습니다.</p><button id="parts">테두리도 보기</button><button id="play">재생 / 일시정지</button><button id="size">128px / 확대</button><main><article><h2>091</h2><object type="image/svg+xml" data="profile_091_legendary.svg"></object></article><article><h2>092</h2><object type="image/svg+xml" data="profile_092_legendary.svg"></object></article><article><h2>093</h2><object type="image/svg+xml" data="profile_093_legendary.svg"></object></article><article><h2>094</h2><object type="image/svg+xml" data="profile_094_legendary.svg"></object></article><article><h2>095</h2><object type="image/svg+xml" data="profile_095_legendary.svg"></object></article><article><h2>096</h2><object type="image/svg+xml" data="profile_096_legendary.svg"></object></article><article><h2>097</h2><object type="image/svg+xml" data="profile_097_legendary.svg"></object></article><article><h2>098</h2><object type="image/svg+xml" data="profile_098_legendary.svg"></object></article><article><h2>099</h2><object type="image/svg+xml" data="profile_099_legendary.svg"></object></article><article><h2>100</h2><object type="image/svg+xml" data="profile_100_legendary.svg"></object></article></main><script>let only=true,paused=false;function update(o){let d=o.contentDocument;if(!d)return;d.querySelectorAll('.fx').forEach(e=>e.style.visibility='hidden');let f=d.querySelector('.fixed-frame');if(f)f.style.visibility=only?'hidden':''}document.querySelectorAll('object').forEach(o=>{o.onload=()=>update(o);update(o)});document.querySelector('#parts').onclick=()=>{only=!only;document.querySelector('#parts').textContent=only?'테두리도 보기':'파츠만 보기';document.querySelectorAll('object').forEach(update)};document.querySelector('#play').onclick=()=>{paused=!paused;document.querySelectorAll('object').forEach(o=>o.contentDocument?.getAnimations().forEach(a=>paused?a.pause():a.play()))};document.querySelector('#size').onclick=()=>document.body.classList.toggle('small');</script></html>
